# DeepSeek Local AI Server Configuration

server:
  host: "0.0.0.0"
  port: 8000
  workers: 1

model:
  # Path to your GGUF model file
  path: "models/deepseek-llama.gguf"

  # Context size (tokens)
  n_ctx: 2048

  # Number of GPU layers (-1 for all, 0 for CPU only)
  n_gpu_layers: -1

  # Batch size
  n_batch: 512

  # Number of threads to use
  n_threads: null  # null = auto

  # Verbosity
  verbose: false

# Generation parameters
generation:
  temperature: 0.7
  top_p: 0.95
  top_k: 40
  max_tokens: 2048
  repeat_penalty: 1.1

# API settings
api:
  # Enable CORS
  cors_enabled: true

  # Enable API documentation
  docs_enabled: true

  # Rate limiting (requests per minute)
  rate_limit: null  # null = disabled

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  file: "logs/server.log"
