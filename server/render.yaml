services:
  - type: web
    name: deepseek-local-server
    runtime: docker
    region: oregon
    plan: standard  # Need more RAM for 7B model
    branch: main

    # Docker configuration
    dockerContext: ./server
    dockerfilePath: ./server/Dockerfile

    # Build settings (model download takes time)
    buildFilter:
      paths:
        - server/Dockerfile
        - server/main.py
        - server/requirements.txt

    # Environment variables
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHONUNBUFFERED
        value: 1
      - key: MODEL_PATH
        value: models/deepseek-llama.gguf

    # Health check
    healthCheckPath: /health

    # Auto-deploy on git push
    autoDeploy: true
